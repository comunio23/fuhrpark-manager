name: TÜV & Werkstatt Erinnerungen

on:
  schedule:
    - cron: '0 7 * * *'   # täglich 07:00 UTC = 09:00 CEST
  workflow_dispatch:        # manuell auslösbar zum Testen

jobs:
  reminder:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Termine prüfen
        uses: actions/github-script@v7
        id: check
        with:
          script: |
            const fs = require('fs');
            if (!fs.existsSync('termine.json')) {
              core.setOutput('send', 'false');
              return;
            }
            const termine = JSON.parse(fs.readFileSync('termine.json', 'utf8'));
            const today = new Date();
            today.setHours(0,0,0,0);
            const in30 = new Date(today.getTime() + 30 * 24 * 60 * 60 * 1000);

            const alerts = [];
            for (const v of termine) {
              if (v.naechsterTuev) {
                const [y, m] = v.naechsterTuev.split('-').map(Number);
                const lastDay = new Date(y, m, 0).getDate();
                const d = new Date(y, m - 1, lastDay);
                const days = Math.round((d - today) / 86400000);
                if (days >= 0 && days <= 30) {
                  const mm = String(m).padStart(2,'0');
                  alerts.push(`• ${v.kennzeichen} (${v.marke} ${v.modell}): TÜV fällig ${mm}.${y} — noch ${days} Tag${days===1?'':'e'}`);
                }
              }
              if (v.naechsteWerkstatt) {
                const d = new Date(v.naechsteWerkstatt);
                const days = Math.round((d - today) / 86400000);
                if (days >= 0 && days <= 30) {
                  const [y2,m2,dd2] = v.naechsteWerkstatt.split('-');
                  alerts.push(`• ${v.kennzeichen} (${v.marke} ${v.modell}): Werkstatt am ${dd2}.${m2}.${y2} — noch ${days} Tag${days===1?'':'e'}`);
                }
              }
            }

            if (alerts.length > 0) {
              core.setOutput('send', 'true');
              core.setOutput('message', alerts.join('\n'));
            } else {
              core.setOutput('send', 'false');
            }

      - name: E-Mail senden
        if: steps.check.outputs.send == 'true'
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.MAIL_USER }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: "⚠️ Fuhrpark: Termine in den nächsten 30 Tagen"
          to: haensel.claudia@katharinenhof.net
          from: Fuhrpark-Manager Katharinenhof
          body: |
            Guten Morgen,

            folgende Fahrzeuge haben in den nächsten 30 Tagen anstehende Termine:

            ${{ steps.check.outputs.message }}

            Bitte entsprechende Termine rechtzeitig vereinbaren.

            — Fuhrpark-Manager Katharinenhof
            https://fuhrpark-katharinenhof.netlify.app
