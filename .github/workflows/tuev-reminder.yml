name: TÜV & Werkstatt Erinnerungen

on:
  schedule:
    - cron: '0 7 * * *'   # täglich 07:00 UTC = 09:00 CEST
  workflow_dispatch:        # manuell auslösbar zum Testen

jobs:
  reminder:
    runs-on: ubuntu-latest
    steps:
      - name: Termine prüfen
        uses: actions/github-script@v7
        id: check
        env:
          SUPABASE_URL: https://bembfesrfepsftragaeq.supabase.co
          SUPABASE_KEY: sb_publishable_f74dwOv__3vvbgEaBmjjVQ_1h2TnCn_
        with:
          script: |
            const url = `${process.env.SUPABASE_URL}/rest/v1/fahrzeuge?select=kennzeichen,marke,modell,naechster_tuev,naechste_werkstatt`;
            const res = await fetch(url, {
              headers: {
                apikey: process.env.SUPABASE_KEY,
                Authorization: `Bearer ${process.env.SUPABASE_KEY}`
              }
            });
            if (!res.ok) {
              core.setFailed(`Supabase-Abfrage fehlgeschlagen: ${res.status} ${await res.text()}`);
              return;
            }
            const fahrzeuge = await res.json();

            const today = new Date();
            today.setHours(0,0,0,0);
            const SCHWELLE_TAGE = 40;

            const alerts = [];
            for (const v of fahrzeuge) {
              if (v.naechster_tuev) {
                const [y, m] = v.naechster_tuev.split('-').map(Number);
                const lastDay = new Date(y, m, 0).getDate();
                const d = new Date(y, m - 1, lastDay);
                const days = Math.round((d - today) / 86400000);
                if (days >= 0 && days <= SCHWELLE_TAGE) {
                  const mm = String(m).padStart(2,'0');
                  alerts.push(`• ${v.kennzeichen} (${v.marke} ${v.modell}): TÜV fällig ${mm}.${y} — noch ${days} Tag${days===1?'':'e'}`);
                }
              }
              if (v.naechste_werkstatt) {
                const d = new Date(v.naechste_werkstatt);
                const days = Math.round((d - today) / 86400000);
                if (days >= 0 && days <= SCHWELLE_TAGE) {
                  const [y2,m2,dd2] = v.naechste_werkstatt.split('-');
                  alerts.push(`• ${v.kennzeichen} (${v.marke} ${v.modell}): Werkstatt am ${dd2}.${m2}.${y2} — noch ${days} Tag${days===1?'':'e'}`);
                }
              }
            }

            if (alerts.length > 0) {
              core.setOutput('send', 'true');
              core.setOutput('message', alerts.join('\n'));
            } else {
              core.setOutput('send', 'false');
            }

      - name: E-Mail senden
        if: steps.check.outputs.send == 'true'
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.MAIL_USER }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: "⚠️ Fuhrpark: Termine in den nächsten 40 Tagen"
          to: haensel.claudia@katharinenhof.net
          from: Fuhrpark-Manager Katharinenhof
          body: |
            Guten Morgen,

            folgende Fahrzeuge haben in den nächsten 40 Tagen anstehende Termine:

            ${{ steps.check.outputs.message }}

            Bitte entsprechende Termine rechtzeitig vereinbaren.

            — Fuhrpark-Manager Katharinenhof
            https://fuhrpark-katharinenhof.netlify.app
